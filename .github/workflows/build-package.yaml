concurrency:
  cancel-in-progress: false
  group: update-flake-lock
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7
      with:
        hatchet-protocol: rampage
        nix-permission-edict: true
    - name: Nix Installer
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        install_options: --no-daemon
    - name: Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: meowos
    - env:
        FLAKE_INPUTS: ${{ inputs.flake-input }}
      name: Update ${{ github.event.inputs.flake-input }}
      run: |-
        read -r -a inputs <<< "$FLAKE_INPUTS"
        (( ${#inputs[@]} > 0 ))
        nix flake update --accept-flake-config -- "${inputs[@]}"
    - env:
        PACKAGES: ${{ inputs.package }}
      name: Build ${{ github.event.inputs.package }}
      run: |-
        read -r -a packages <<< "$PACKAGES"
        (( ${#packages[@]} > 0 ))
        for package in "${packages[@]}"; do
          nix build ".#$package" --print-build-logs --accept-flake-config
        done
    - name: Upload updated flake.lock
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: manual-flake-lock
        path: flake.lock
        retention-days: 1
  create-pr:
    needs:
    - build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download updated flake.lock
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: manual-flake-lock
    - name: Open flake update PR
      uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
      with:
        add-paths: flake.lock
        body: Flake inputs and the selected package builds were updated by the manual
          workflow.
        branch: updates/manual-flake-inputs
        commit-message: 'chore(deps): update flake inputs'
        delete-branch: true
        title: 'chore(deps): update flake inputs'
name: Update and build packages
'on':
  workflow_dispatch:
    inputs:
      flake-input:
        description: Flake input(s) to update
        required: true
      package:
        description: Package(s) to build
        required: true
