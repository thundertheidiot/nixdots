jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7
      with:
        hatchet-protocol: rampage
        nix-permission-edict: true
    - name: Nix Installer
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        install_options: --no-daemon
    - name: Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: meowos
    - name: Build server2
      run: nix build --accept-flake-config .#nixosConfigurations.server2.config.system.build.toplevel
    - name: Build vps
      run: nix build --accept-flake-config .#nixosConfigurations.vps.config.system.build.toplevel
    - name: Build framework
      run: nix build --accept-flake-config .#nixosConfigurations.framework.config.system.build.toplevel
'on':
  workflow_dispatch: {}
permissions:
  contents: read
