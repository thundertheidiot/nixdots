concurrency:
  cancel-in-progress: false
  group: update-flake-lock
jobs:
  build-matrix:
    needs:
    - update-lockfile
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7
      with:
        hatchet-protocol: rampage
        nix-permission-edict: true
    - name: Nix Installer
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        install_options: --no-daemon
    - name: Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: meowos
    - name: Download flake.lock
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: flake-lock
    - name: Build ${{ matrix.target }}
      run: |-
        for i in ${{ matrix.target }}; do
          nix build .#$i --print-build-logs --accept-flake-config
        done
    strategy:
      matrix:
        target:
        - nixosConfigurations.vps.pkgs.meowdzbot nixosConfigurations.vps.pkgs.sodexobot
        - nixosConfigurations.vps.pkgs.leptos-kotiboksi
  create-pr:
    needs:
    - update
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download verified flake.lock
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: verified-flake-lock
    - name: Open flake update PR
      uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
      with:
        add-paths: flake.lock
        body: Automated flake input update. The configured package and host builds
          passed.
        branch: updates/flake-lock
        commit-message: 'chore(deps): bump flake.lock'
        delete-branch: true
        title: 'chore(deps): bump flake.lock'
  update:
    needs:
    - build-matrix
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7
      with:
        hatchet-protocol: rampage
        nix-permission-edict: true
    - name: Nix Installer
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        install_options: --no-daemon
    - name: Cachix
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: meowos
    - name: Download flake.lock
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: flake-lock
    - name: Prefetch displaylink
      run: nix develop --accept-flake-config -c just prefetch
    - name: Build server2
      run: nix build --accept-flake-config .#nixosConfigurations.server2.config.system.build.toplevel
    - name: Build vps
      run: nix build --accept-flake-config .#nixosConfigurations.vps.config.system.build.toplevel
    - name: Build framework
      run: nix build --accept-flake-config .#nixosConfigurations.framework.config.system.build.toplevel
    - name: Upload verified flake.lock
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: verified-flake-lock
        path: flake.lock
        retention-days: 1
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Nix Installer
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        install_options: --no-daemon
    - name: Update flake.lock
      run: nix flake update --accept-flake-config
    - name: Upload flake.lock
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: flake-lock
        path: flake.lock
        retention-days: 1
name: Update flake.lock
'on':
  schedule:
  - cron: 0 03 */4 * *
  workflow_dispatch: {}
permissions:
  contents: read
