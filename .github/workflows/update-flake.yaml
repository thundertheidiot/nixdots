concurrency:
  cancel-in-progress: false
  group: update-flake-lock
jobs:
  build-matrix:
    needs:
    - update-lockfile
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: rampage
        nix-permission-edict: true
    - name: Nix Installer
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        install_options: --no-daemon
    - name: Cachix
      uses: cachix/cachix-action@v17
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: meowos
    - name: Download flake.lock
      uses: actions/download-artifact@v4
      with:
        name: flake-lock
    - name: Build ${{ matrix.target }}
      run: |-
        for i in ${{ matrix.target }}; do
          nix build .#$i --print-build-logs --accept-flake-config
        done
    strategy:
      matrix:
        target:
        - nixosConfigurations.vps.pkgs.meowdzbot nixosConfigurations.vps.pkgs.sodexobot
        - nixosConfigurations.vps.pkgs.leptos-kotiboksi
  update:
    needs:
    - build-matrix
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: wimpysworld/nothing-but-nix@v10
      with:
        hatchet-protocol: rampage
        nix-permission-edict: true
    - name: Nix Installer
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        install_options: --no-daemon
    - name: Cachix
      uses: cachix/cachix-action@v17
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: meowos
    - name: Download flake.lock
      uses: actions/download-artifact@v4
      with:
        name: flake-lock
    - name: Prefetch displaylink
      run: nix develop --accept-flake-config -c just prefetch
    - name: Build server2
      run: nix build --accept-flake-config .#nixosConfigurations.server2.config.system.build.toplevel
    - name: Build vps
      run: nix build --accept-flake-config .#nixosConfigurations.vps.config.system.build.toplevel
    - name: Build framework
      run: nix build --accept-flake-config .#nixosConfigurations.framework.config.system.build.toplevel
    - name: Commit
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        branch: main
        commit_author: Flake Bot Update <actions@github.com>
        commit_message: 'chore(deps): bump flake.lock'
        commit_user_name: Flake Bot Update
        file_pattern: flake.lock
        skip_dirty_check: false
        skip_fetch: true
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Nix Installer
      uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        install_options: --no-daemon
    - name: Update flake.lock
      run: nix flake update --accept-flake-config
    - name: Upload flake.lock
      uses: actions/upload-artifact@v4
      with:
        name: flake-lock
        path: flake.lock
        retention-days: 1
name: Update flake.lock
'on':
  schedule:
  - cron: 0 03 */4 * *
  workflow_dispatch: {}
